services:
  spectra.web:
    build:
      context: .
      dockerfile: Dockerfile
    image: spectra-web:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MongoDb: mongodb://mongodb:27017/SpectraDB
      ConnectionStrings__IdentityConnection: "Host=postgres;Port=5432;Database=SpectraIdentity;Username=postgres;Password=${POSTGRES_PASSWORD:-spectra_dev_password};Include Error Detail=true"
      ConnectionStrings__LoggingConnection: "Host=postgres;Port=5432;Database=SpectraIdentity;Username=postgres;Password=${POSTGRES_PASSWORD:-spectra_dev_password};Include Error Detail=true"
      Jwt__Key: ${JWT_KEY:-change-this-development-key}
      Jwt__Issuer: ${JWT_ISSUER:-http://localhost:8080}
      Jwt__Audience: ${JWT_AUDIENCE:-http://localhost:8080}
      AllowedCorsOrigins__0: ${CORS_ORIGIN_0:-http://localhost:3000}
      AllowedCorsOrigins__1: ${CORS_ORIGIN_1:-http://localhost:5500}
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy

  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: SpectraDB
    volumes:
      - spectra-mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: SpectraIdentity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spectra_dev_password}
    volumes:
      - spectra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SpectraIdentity"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  spectra-mongodb-data:
  spectra-postgres-data: